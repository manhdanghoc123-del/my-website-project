<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Tiêu đề <h1> -->
    <h1>Trang web của tôi</h1>

    <!-- 2. Đoạn văn <p> mô tả bản thân -->
    <p class="bio">
        Xin chào! Tôi là một người yêu thích công nghệ và đang trên hành trình học lập trình Web để tạo ra những sản phẩm sáng tạo và hữu ích.
    </p>

    <!-- 3. Danh sách <ul> 3 sở thích -->
    <ul class="hobbies-list">
        <li class="hobby-1">Đọc sách công nghệ</li>
        <li class="hobby-2">Lập trình Web</li>
        <li class="hobby-3">Nghe nhạc và du lịch</li>
    </ul>

    <!-- 4. Nút bấm <button> -->
    <button class="my-btn">Nhấn vào đây</button>

</body>
</html>
